name: get gnss tle

on:
  schedule:
  - cron: "10 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita que duas execucoes deste workflow tentem commitar ao mesmo tempo.
concurrency:
  group: gnss-tle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install requests

      - name: Fetch all GNSS TLEs and commit if changed
        run: |
          python gnss.py
          git add -A data/gnss
          if ! git diff --cached --quiet; then
            git config --global user.name 'GitHub Actions'
            git config --global user.email 'actions@github.com'
            git commit -m "Update gnss data"
            git push
          fi
